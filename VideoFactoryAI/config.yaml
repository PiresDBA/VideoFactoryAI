agent:
  checkpoint_enabled: true
  clean_temp_on_success: false
  verbose: true
media:
  ai_image_provider: pollinations
  desabilitar_openverse: true
  desabilitar_pexels: true
  desabilitar_pixabay: true
  force_regeneration: false
  gemini_fallback: true
  gemini_only: false
  ignore_cache: false
  local_media_enabled: true
  local_media_folder: imagens
  local_media_mode: required
  local_ollama_candidate_count: 4
  local_ollama_model: llava-phi3
  local_ollama_timeout_s: 180
  local_ollama_url: http://127.0.0.1:11434
  local_similarity_threshold: 0.8
  media_source_mode: local_only
  min_local_images: 0
  pexels_api_key: ''
  pixabay_api_key: ''
  prefer_real_media: true
  reuse_approved_images: true
  revalidate_images: false
  unsplash_api_key: ''
  web_research_before_generation: true
  webchat_image_search: true
  youtube_mode: 'off'
output:
  thumbnail_filename: thumbnail.jpg
  thumbnail_height: 720
  thumbnail_width: 1280
  video_filename: documentario_final.mp4
pipeline:
  resume_mode: true
  reuse_existing_audio: true
scenes:
  max_duration_s: 25.0
  min_duration_s: 5.0
  target_duration_s: 12.0
subtitles:
  font_size: 24
  margin_v: 35
  outline_color: '&H00000000'
  outline_width: 2
  primary_color: '&H00FFFFFF'
  shadow: 1
tts:
  engine: xtts
  f5_ref_audio: voice/minhavoz_curta.wav
  f5_ref_text: Olá, imagine duas nações que já foram aliadas.
  openai_voice: onyx
  pitch: +0Hz
  rate: +0%
  voice: pt-BR-AntonioNeural
  xtts_chunk_chars: 240
  xtts_gap_ms: 220
  xtts_language: pt
  xtts_python: C:\Users\Pires\miniconda3\envs\xtts\python.exe
  xtts_speaker_wav: voice/xtts/ale.wav
  xtts_timeout_s: 7200
  xtts_use_cuda: true
  xtts_worker: voice/xtts/xtts_worker.py
video:
  crf: 18
  default_image_effect: auto
  fps: 30
  height: 1080
  preset: medium
  width: 1920
whisper:
  device: auto
  language: pt
  model: medium
ytdlp:
  enabled: true
  format: bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best
  license_filter: creativecommons
  max_search_results: 20

# VideoFactoryAI — Configuração Central
# Edite este arquivo para personalizar o agente sem tocar em nenhum Python.

# ── Narração (TTS) ─────────────────────────────────────────────────────────────
tts:
  engine: xtts               # edge-tts | xtts | f5-tts | openai
  voice: pt-BR-AntonioNeural # pt-BR-AntonioNeural | pt-BR-FranciscaNeural | pt-BR-ThalitaNeural
  rate: "+0%"                # velocidade: "-10%" mais lento, "+15%" mais rápido
  pitch: "+0Hz"              # tom: "-5Hz" mais grave

  # XTTS-v2 (clonagem da sua voz em GPU) — só ativo se engine = xtts
  # Requer o ambiente conda 'xtts' já instalado (torch 2.3.1+cu118, TTS, Python 3.10).
  xtts_python: C:\Users\Pires\miniconda3\envs\xtts\python.exe
  xtts_speaker_wav: voice/xtts/ale.wav   # amostra limpa da sua voz (10-30s)
  xtts_worker: voice/xtts/xtts_worker.py
  xtts_language: pt
  xtts_use_cuda: true
  xtts_chunk_chars: 240      # tamanho dos trechos enviados ao modelo
  xtts_gap_ms: 220           # pausa entre trechos (ms)
  xtts_timeout_s: 7200       # limite de segurança por narração completa

  # F5-TTS (clonagem de voz local) — só ativo se engine = f5-tts
  f5_ref_audio: voice/minhavoz_curta.wav
  f5_ref_text: "Olá, imagine duas nações que já foram aliadas."

  # OpenAI TTS — só ativo se engine = openai
  openai_voice: onyx         # alloy | echo | fable | onyx | nova | shimmer

# ── Whisper (Legendas) ────────────────────────────────────────────────────────
whisper:
  model: medium              # tiny | base | small | medium | large (medium recomendado para PT-BR)
  language: pt               # código ISO do idioma do roteiro
  device: auto               # auto | cuda | cpu

# ── Segmentação de Cenas ──────────────────────────────────────────────────────
scenes:
  target_duration_s: 12.0    # duração-alvo por cena (segundos)
  min_duration_s: 5.0        # duração mínima
  max_duration_s: 25.0       # duração máxima

# ── Busca de Mídia ────────────────────────────────────────────────────────────
media:
  gemini_only: false
  prefer_real_media: true
  web_research_before_generation: true
  media_source_mode: local_only # local_only | local_then_online | webchat_only | internet_images
  min_local_images: 0 # 0 = uma imagem por cena; maior que 0 reparte imagens em cortes por cena
  local_media_mode: required   # off | prefer | required (required nunca busca online)
  local_media_enabled: true
  local_media_folder: imagens
  local_similarity_threshold: 0.80
  local_ollama_model: llava-phi3
  local_ollama_url: http://127.0.0.1:11434
  local_ollama_candidate_count: 4
  local_ollama_timeout_s: 180
  revalidate_images: false
  force_regeneration: false
  reuse_approved_images: true
  gemini_fallback: true
  ignore_cache: false
  pixabay_api_key: ""
  pexels_api_key: ""         # Adicione sua chave Pexels para mais vídeos/imagens reais
  unsplash_api_key: ""       # Adicione sua chave Unsplash para mais fotos reais
  ai_image_provider: pollinations    # pollinations | dalle3
  # openai_api_key: ""               # descomente se usar dalle3 ou tts=openai

# ── FFmpeg / Vídeo ────────────────────────────────────────────────────────────
video:
  width: 1920
  height: 1080
  fps: 30
  crf: 18                    # qualidade H.264 (0=lossless, 51=pior). 18 = alta qualidade
  preset: medium             # ultrafast | fast | medium | slow
  default_image_effect: auto  # auto | pan | slide | static

# ── yt-dlp Video Downloader ──────────────────────────────────────────────────
# Permite baixar vídeos com licença Creative Commons do YouTube, Vimeo, Archive.org
ytdlp:
  enabled: true
  max_search_results: 20
  format: "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"
  license_filter: "creativecommons"  # creativecommons | publicdomain | cc-by | cc-by-sa
  # Para instalar: pip install yt-dlp

# ── Legendas ──────────────────────────────────────────────────────────────────
subtitles:
  font_size: 24
  primary_color: "&H00FFFFFF"   # branco puro
  outline_color: "&H00000000"   # preto
  outline_width: 2
  shadow: 1
  margin_v: 35                  # margem do rodapé em pixels

# ── Saídas ────────────────────────────────────────────────────────────────────
output:
  video_filename: documentario_final.mp4
  thumbnail_filename: thumbnail.jpg
  thumbnail_width: 1280
  thumbnail_height: 720

# ── Agente / Sistema ──────────────────────────────────────────────────────────
agent:
  checkpoint_enabled: true    # salva estado para retomada com --resume
  verbose: true               # mostra progresso detalhado
  clean_temp_on_success: false  # apaga temp_clips/ após sucesso

# ── Retomada e reutilização ──────────────────────────────────────────────────
pipeline:
  resume_mode: true
  reuse_existing_audio: true  # só reutiliza quando o hash do roteiro coincide

# ── Variáveis de Ambiente Suportadas (sobrescrevem este config) ────────────────
# VF_MODO_ESCRITA=webchat          # Usa LLMs via navegador (Gemini, ChatGPT, Copilot, DeepSeek)
# VF_WEBCHAT_DIR=C:\caminho\webchat_bridge  # Pasta do webchat_bridge.py
# VF_WEBCHAT_SITES=gemini,chatgpt,copilot,deepseek,perplexity  # Ordem dos LLMs
# VF_WEBCHAT_VALIDAR=resposta      # Validação: nenhum | resposta | envio | ambos
#
# VF_IMAGE_EVAL=1                  # Ativa avaliador de imagem↔roteiro (padrão: 1)
# VF_IMAGE_MIN_SCORE=65            # Score mínimo 0-100 para aprovar imagem (padrão: 65)
# VF_IMAGE_MAX_RETRIES=3           # Tentativas por cena antes de aceitar fallback (padrão: 3)
#
# VF_WHISPER_MODEL=medium          # Modelo Whisper: tiny/base/small/medium/large

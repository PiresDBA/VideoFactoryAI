# Canal: História
# Estilo: épico, contemplativo, narração pausada com peso emocional

tts:
  voice: "pt-BR-AntonioNeural"
  rate: "-8%"
  pitch: "-4Hz"

video:
  width: 1920
  height: 1080
  fps: 24
  crf: 17
  preset: "slow"
  ken_burns_zoom_speed: 0.0005

subtitles:
  font_size: 28
  margin_v: 45
  font_color: "&HFAF0E6"
  outline_color: "&H1A0000"
  outline_size: 2

output:
  video_filename: "historia_final.mp4"
  thumbnail_filename: "thumbnail_historia.jpg"
  thumbnail_width: 1280
  thumbnail_height: 720

media:
  preferred_sources:
    - internet_archive
    - wikimedia_commons
    - library_of_congress
    - pixabay
  ai_image_provider: "pollinations"
  prefer_video_over_image: true
  min_clip_quality: "hd"
  style_hints:
    - "vintage"
    - "historical"
    - "sepia"
    - "archival"

channel:
  name: "historia"
  description: "Documentários históricos com estética cinematográfica e ritmo épico"
  color_grade: "sepia_cinematic"
  intro_duration_s: 4
  outro_duration_s: 6
  logo: null
  music_style: "epic_orchestral"
  music_volume: 0.07

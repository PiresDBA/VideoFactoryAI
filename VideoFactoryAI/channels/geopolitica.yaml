# Canal: Geopolítica
# Estilo: urgente, analítico, cuts rápidos, voz masculina firme

tts:
  voice: "pt-BR-AntonioNeural"
  rate: "+3%"
  pitch: "+0Hz"

video:
  width: 1920
  height: 1080
  fps: 30
  crf: 18
  preset: "fast"
  ken_burns_zoom_speed: 0.0010

subtitles:
  font_size: 28
  margin_v: 38
  font_color: "&HFFFFFF"
  outline_color: "&H000000"
  outline_size: 3

output:
  video_filename: "geopolitica_final.mp4"
  thumbnail_filename: "thumbnail_geo.jpg"
  thumbnail_width: 1280
  thumbnail_height: 720

media:
  preferred_sources:
    - wikimedia_commons
    - internet_archive
    - library_of_congress
    - pixabay
    - pexels
  ai_image_provider: "pollinations"
  prefer_video_over_image: true
  min_clip_quality: "hd"

channel:
  name: "geopolitica"
  description: "Análises geopolíticas com ritmo acelerado e fontes documentais"
  color_grade: "high_contrast_cool"
  intro_duration_s: 2
  outro_duration_s: 3
  logo: null
  music_style: "tense_news"
  music_volume: 0.05

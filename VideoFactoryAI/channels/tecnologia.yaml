# Canal: Tecnologia
# Estilo: moderno, ágil, voz neutra e clara, cuts limpos

tts:
  voice: "pt-BR-FranciscaNeural"
  rate: "+5%"
  pitch: "+2Hz"

video:
  width: 1920
  height: 1080
  fps: 30
  crf: 18
  preset: "fast"
  ken_burns_zoom_speed: 0.0009

subtitles:
  font_size: 26
  margin_v: 36
  font_color: "&H00F5FF"
  outline_color: "&H001020"
  outline_size: 2

output:
  video_filename: "tecnologia_final.mp4"
  thumbnail_filename: "thumbnail_tech.jpg"
  thumbnail_width: 1280
  thumbnail_height: 720

media:
  preferred_sources:
    - pixabay
    - pexels
    - unsplash
    - wikimedia_commons
  ai_image_provider: "pollinations"
  prefer_video_over_image: true
  min_clip_quality: "fhd"
  style_hints:
    - "technology"
    - "digital"
    - "modern"
    - "data"
    - "innovation"

channel:
  name: "tecnologia"
  description: "Canal de tech com voz feminina clara e visual moderno e clean"
  color_grade: "cool_blue_modern"
  intro_duration_s: 2
  outro_duration_s: 3
  logo: null
  music_style: "electronic_ambient"
  music_volume: 0.05

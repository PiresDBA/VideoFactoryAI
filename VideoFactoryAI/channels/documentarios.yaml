# Canal: Documentários Gerais
# Estilo: sóbrio, jornalístico, narração grave e pausada

tts:
  voice: "pt-BR-AntonioNeural"
  rate: "-5%"
  pitch: "-2Hz"

video:
  width: 1920
  height: 1080
  fps: 30
  crf: 18
  preset: "slow"
  ken_burns_zoom_speed: 0.0006

subtitles:
  font_size: 26
  margin_v: 40
  font_color: "&HFFFFFF"
  outline_color: "&H000000"
  outline_size: 2

output:
  video_filename: "documentario_final.mp4"
  thumbnail_filename: "thumbnail.jpg"
  thumbnail_width: 1280
  thumbnail_height: 720

media:
  preferred_sources:
    - pixabay
    - wikimedia_commons
    - internet_archive
    - pexels
  ai_image_provider: "pollinations"
  prefer_video_over_image: true
  min_clip_quality: "hd"

channel:
  name: "documentarios"
  description: "Canal de documentários sérios com narração masculina grave"
  color_grade: "desaturated_warm"
  intro_duration_s: 3
  outro_duration_s: 5
  logo: null
  music_style: "ambient_orchestral"
  music_volume: 0.06
